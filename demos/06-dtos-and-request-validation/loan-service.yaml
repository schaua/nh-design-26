openapi: 3.0.3
info:
  title: Loan Processing & Settlement Service
  description: >
    Submits loans for validation and execution against a client's portfolio.
    See previous module for the underlying business rules.
  version: 1.0.0
  license:
    name: Internal use only
    url: /internal
servers:
  - url: /v1

paths:
  /loans:
    get:
      summary: Retrieve a list of loans
      operationId: listLoans
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of loans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/loanResponse'
        '401':
          description: Missing or invalid JWT (see Module 9)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No loans found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Submit an loan for processing
      operationId: submitloan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/loanRequest'
            example:
              ISBN: "978-0-13-539857-9"
              resourceType: BOOK  
              member: M001
              side: CHECKOUT
      responses:
        '201':
          description: loan accepted and executed
          headers:
            Location:
              description: URL of the newly created loan
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/loanResponse'
              example:
                id: "42"
                status: ACCEPTED
                fee: 15.0
        '400':
          description: The loan failed validation (bad input shape, not a business rule rejection)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid JWT (see Module 9)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            The loan was well-formed but rejected by a business rule
            (resource loan limit, exceeding latefees limit) 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/loanResponse'
              example:
                id: "43"
                status: REJECTED
                reason: "would exceed the member's resource loan limit"

components:
  schemas:
    loanRequest:
      type: object
      required: [ISBN, resourceType, member, side]
      properties:
        ISBN    :
          type: string
          example: "978-0-13-539857-9"  
        resourceType:
          type: string
          enum: [BOOK, DVD, MAGAZINE]
        member:
          type: string
          example: M001
        side:
          type: string
          enum: [CHECKOUT, RETURN]

    loanResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [ACCEPTED, REJECTED]
        fee:
          type: number
          format: double
          nullable: true
          description: Present only when status is ACCEPTED
        reason:
          type: string
          nullable: true
          description: Present only when status is REJECTED

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
