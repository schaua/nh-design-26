spring.application.name=librarycd -service

# Your local Postgres install from Sprint 3 — adjust username/password to match your own setup
spring.datasource.url=jdbc:postgresql://localhost:5432/library
spring.datasource.username=postgres
spring.datasource.password=n3u3d4!

# The schema already exists (Sprint 3's enterprise-schema.sql) - never let
# Hibernate touch it. In a real project this would be "validate" at most;
# "none" here keeps this demo strictly read-only against shared seed data.
spring.jpa.hibernate.ddl-auto=none

# Log the SQL Hibernate actually generates - worth showing live
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
